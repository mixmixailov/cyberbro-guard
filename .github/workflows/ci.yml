name: CI

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main, 'release/*' ]
  pull_request:
    branches: [ main, 'release/*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Create reports directory
        run: mkdir -p reports
        
      - name: Test with pytest
        run: |
          pytest tests/ -v \
            --junitxml=reports/pytest-${{ matrix.python-version }}.xml \
            --cov=app \
            --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml \
            --cov-report=html:reports/htmlcov-${{ matrix.python-version }}/ \
            --cov-report=term-missing
        env:
          PYTEST_CURRENT_TEST: "1"
          BOT_TOKEN: "test_token"
          WEBHOOK_SECRET: "test_secret"
          DEBUG: "true"

      - name: Run bug reproduction tests
        run: |
          mkdir -p reports
          pytest -m "bug" tests/unit/ -v \
            --junitxml=reports/bug-repro-${{ matrix.python-version }}.xml
        env:
          PYTEST_CURRENT_TEST: "1"
          BOT_TOKEN: "test_token"
          WEBHOOK_SECRET: "test_secret"
          DEBUG: "true"
        continue-on-error: true  # Bug repro tests are expected to fail

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            reports/pytest-${{ matrix.python-version }}.xml
            reports/coverage-${{ matrix.python-version }}.xml
            reports/htmlcov-${{ matrix.python-version }}/
            reports/bug-repro-${{ matrix.python-version }}.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.11'
        with:
          file: reports/coverage-${{ matrix.python-version }}.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint_test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright
        run: |
          playwright install --with-deps chromium

      - name: Build Docker image
        run: |
          docker build -t cyberbro-guard:test .

      - name: Start test environment
        run: |
          docker-compose -f docker-compose.yml up -d
          sleep 10  # Wait for services to start
        env:
          BOT_TOKEN: "test_token"
          WEBHOOK_SECRET: "test_secret"
          DEBUG: "true"

      - name: Wait for service health
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/readyz; do sleep 2; done'

      - name: Run E2E tests
        run: |
          mkdir -p reports
          pytest tests/e2e/ -v \
            --junitxml=reports/e2e-results.xml \
            --html=reports/e2e-report.html \
            --self-contained-html
        env:
          E2E_BASE_URL: "http://localhost:8080"
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

      - name: Run E2E bug reproduction tests
        run: |
          # Find and run E2E tests marked with @bug in test names
          find tests/e2e -name "*.spec.ts" -exec grep -l "@bug" {} \; | \
          xargs -r npx playwright test --reporter=junit --output-dir=reports/e2e-bug-repro/
        env:
          E2E_BASE_URL: "http://localhost:8080"
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        continue-on-error: true  # E2E bug repro tests are expected to fail

      - name: Capture service logs
        if: always()
        run: |
          mkdir -p reports/logs
          docker-compose logs > reports/logs/docker-compose.log 2>&1 || true
          docker logs cyberbro-bot > reports/logs/bot.log 2>&1 || true

      - name: Stop test environment
        if: always()
        run: |
          docker-compose down -v

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            reports/e2e-results.xml
            reports/e2e-report.html
            reports/e2e-bug-repro/
            reports/logs/
            test-results/
          retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Bandit security linter
        run: |
          mkdir -p reports
          pip install bandit[toml]
          bandit -r app/ -f json -o reports/bandit-results.json || true
          bandit -r app/ -f txt || true

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            trivy-results.sarif
            reports/bandit-results.json
          retention-days: 90