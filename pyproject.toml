[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Skip assert_used test

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as end-to-end integration tests", 
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async",
    "bug: marks tests that reproduce specific bugs",
    "issue_id: marks tests with GitHub issue ID for tracking",
    "handlers: marks tests for Telegram handlers area",
    "services: marks tests for business logic services area",
    "db: marks tests for database layer area", 
    "payments: marks tests for payment system area",
    "queue: marks tests for queue/DLQ system area",
    "i18n: marks tests for internationalization area",
    "ci: marks tests for CI/CD pipeline area"
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
ignore_missing_imports = true